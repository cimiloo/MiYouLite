name: Build MiYouLite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (ldid, xz, dpkg)
        run: |
          brew install ldid xz dpkg || true

      - name: Setup roothide Theos
        run: |
          set -e
          git config --global http.postBuffer 524288000
          rm -rf "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          # 清掉所有可能残留的旧 deb，避免 find 捞到过时版本
          rm -rf packages
          find "$GITHUB_WORKSPACE" -maxdepth 2 -name '*.deb' -delete || true
          # 捕获 make 输出，并把报错行转成 GitHub error 注解，便于外部（无 admin 权限）诊断
          set +e
          make package FINALPACKAGE=1 2>&1 | tee build_output.log
          RC=${PIPESTATUS[0]}
          set -e
          grep -E "error:|fatal error:|No such file or directory|make\[|Makefile" build_output.log \
            | sed 's|^|::error::|' || true
          if [ "$RC" -ne 0 ]; then
            echo "=== BUILD FAILED rc=$RC ==="
            tail -n 40 build_output.log
            exit "$RC"
          fi
          DEB_FILE=$(find "$GITHUB_WORKSPACE/packages" -name '*.deb' | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "ERROR: no deb produced under packages/"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name '*.deb'
            exit 1
          fi
          ls -l "$DEB_FILE"
          echo "DEB_PATH=$DEB_FILE" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_FILE")" >> "$GITHUB_ENV"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 删除旧的 latest 发布（连同其资产），保证 Release 里只有干净的新版本
          gh release delete latest --yes || true
          gh release create latest "$DEB_PATH" \
            --title "Latest Build" \
            --notes "Auto-built from ${{ github.sha }} (${{ env.DEB_NAME }})"
