name: Build MiYouLite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (ldid, xz, dpkg)
        run: |
          brew install ldid xz dpkg || true

      - name: Setup roothide Theos
        run: |
          set -e
          git config --global http.postBuffer 524288000
          rm -rf "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p packages
          make package FINALPACKAGE=1
          DEB_FILE=$(find "$GITHUB_WORKSPACE" -name '*.deb' | head -1)
          echo "DEB_PATH=$DEB_FILE" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_FILE")" >> "$GITHUB_ENV"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}

      - name: Publish to GitHub Release (latest)
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: Latest Build
          body: |
            Auto-built from ${{ github.sha }}
            Commit: ${{ github.event.head_commit.message }}
          artifacts: ${{ env.DEB_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
