name: Build MiYouLite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (ldid, xz, dpkg)
        run: |
          brew install ldid xz dpkg || true

      - name: Setup roothide Theos
        run: |
          set -e
          git config --global http.postBuffer 524288000
          rm -rf "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 清空旧产物，避免 theos 把历史 deb 留在 packages/ 被误选
          rm -rf packages
          make package FINALPACKAGE=1
          echo "=== 构建后 packages 目录内容 ==="
          find "$GITHUB_WORKSPACE/packages" -name '*.deb' -exec ls -l {} \;
          # 直接从 control 推导 deb 文件名，确保版本号与 control 一致
          PKG=$(grep '^Package:' control | awk '{print $2}')
          VER=$(grep '^Version:' control | awk '{print $2}')
          ARCH=$(grep '^Architecture:' control | awk '{print $2}')
          DEB_NAME="${PKG}_${VER}_${ARCH}.deb"
          DEB_PATH="$GITHUB_WORKSPACE/packages/$DEB_NAME"
          ls -l "$DEB_PATH"
          echo "DEB_PATH=$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$DEB_NAME" >> "$GITHUB_ENV"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}

      - name: Remove old release assets (tag: latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -n "$REL_ID" ]; then
            ASSET_IDS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets" \
              | python3 -c "import sys,json; print(' '.join(str(a['id']) for a in json.load(sys.stdin)))")
            for AID in $ASSET_IDS; do
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID"
              echo "deleted old asset $AID"
            done
          fi

      - name: Publish to GitHub Release (latest)
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: Latest Build
          body: |
            Auto-built from ${{ github.sha }}
            Commit: ${{ github.event.head_commit.message }}
          artifacts: ${{ env.DEB_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
