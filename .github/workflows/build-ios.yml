name: build-ios

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos 与 iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: 编译
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make 2>&1 | tail -60
          echo "--- 产物 ---"
          find .theos -maxdepth 5 -name "*.app" -type d

      - name: 打包 tipa / ipa
        run: |
          APP=$(find .theos -maxdepth 5 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          APPNAME=$(basename "$APP" .app)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          if command -v ldid >/dev/null; then ldid -S "Payload/$APPNAME/$APPNAME" || true; fi
          zip -qry JijianContacts.tipa Payload
          cp JijianContacts.tipa JijianContacts.ipa
          ls -la Payload/"$APPNAME" | head -20
          ls -la *.tipa *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: jijian-contacts-ipa
          path: |
            JijianContacts.tipa
            JijianContacts.ipa

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag: build-${{ github.run_number }}
          name: JijianContacts build ${{ github.run_number }}
          files: |
            JijianContacts.tipa
            JijianContacts.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
