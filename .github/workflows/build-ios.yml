name: build-ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos 与工具链
        run: |
          set +e
          bash scripts/setup-theos.sh > /tmp/setup.log 2>&1
          echo "SETUP_EXIT=$?" >> /tmp/setup.log
          tail -30 /tmp/setup.log
          grep -q "SETUP DONE" /tmp/setup.log || exit 1

      - name: 编译
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          set +e
          make > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?" >> /tmp/build.log
          tail -30 /tmp/build.log
          find .theos -maxdepth 5 -name "*.app" -type d

      - name: 打包 tipa / ipa
        run: |
          APP=$(find .theos -maxdepth 5 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "没有产出 .app"; exit 1; fi
          APPNAME=$(basename "$APP" .app)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          if command -v ldid >/dev/null; then ldid -S "Payload/$APPNAME/$APPNAME" || true; fi
          zip -qry JijianContacts.tipa Payload
          cp JijianContacts.tipa JijianContacts.ipa
          ls -la *.tipa *.ipa

      - name: 把产物提交回分支
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f JijianContacts.tipa JijianContacts.ipa setup.log build.log
          git commit -m "build: JijianContacts 产物 [skip ci]" || echo "无变化"
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: jijian-contacts-ipa
          path: |
            JijianContacts.tipa
            JijianContacts.ipa
